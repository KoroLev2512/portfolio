# /etc/nginx/sites-available/dev-by-yurii.ru
# Замени dev-by-yurii.ru на твой реальный домен при необходимости

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name dev-by-yurii.ru www.dev-by-yurii.ru;

    # Максимальный размер тела запроса (для загрузки изображений в Sanity Studio)
    client_max_body_size 50M;

    # Сжатие gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;

        # WebSocket support (Sanity Studio, Next.js live previews)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
